<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Home — D.H.</title>
<meta name="description" content="Second Home, a psychological thriller by D.H. (Dina Helmy).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Oswald:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 2.5rem 16px 3rem;
    background:
      radial-gradient(ellipse at 50% 45%, #a43aa9 0%, var(--violet) 25%, var(--plum) 62%, var(--night) 100%);
    overflow: hidden;
    position: relative;
  }
  .kicker {
    font-family: var(--display);
    font-size: clamp(0.75rem, 2.6vw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 0;
    color: var(--paper);
    opacity: 0;
    animation: fade 1.4s ease 0.2s forwards;
  }
  .author {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(4rem, 22vw, 8rem);
    line-height: 1;
    letter-spacing: 0.12em;
    margin: 0.5rem 0 0;
    padding-left: 0.12em;
    color: var(--paper);
    opacity: 0;
    animation: fade 1.6s ease 0.5s forwards;
  }
  .art { width: min(360px, 88vw); margin: 0 auto; }
  .title {
    position: relative;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(3.4rem, 17vw, 6.8rem);
    line-height: 0.95;
    margin: 0;
    color: transparent;
    letter-spacing: 0.03em;
  }
  .title::before, .title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: var(--blood);
  }
  /* The title cracks along a diagonal line */
  .title::before {
    clip-path: polygon(0 0, 100% 0, 100% 38%, 0 62%);
    animation: crack-top 0.5s cubic-bezier(.3,1.6,.5,1) 3.2s forwards;
  }
  .title::after {
    clip-path: polygon(0 64%, 100% 40%, 100% 100%, 0 100%);
    animation: crack-bottom 0.5s cubic-bezier(.3,1.6,.5,1) 3.2s forwards;
  }
  @keyframes crack-top    { to { transform: translate(-4px, -3px) rotate(-0.6deg); } }
  @keyframes crack-bottom { to { transform: translate(5px, 3px) rotate(0.5deg); } }
  .title-wrap { opacity: 0; animation: fade 1s ease 2.4s forwards; }
  .byline {
    margin: 1.2rem 0 0;
    font-style: italic;
    color: var(--paper);
  }
  .begin {
    display: inline-block;
    margin-top: 1.8rem;
    padding: 0.85rem 2.2rem;
    border: 1px solid var(--paper);
    border-radius: 999px;
    font-family: var(--display);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    font-size: 0.9rem;
    transition: background 0.3s, color 0.3s;
  }
  .begin:hover, .begin:focus-visible { background: var(--paper); color: var(--night); }

  /* Art motion */
  .shadow-couple { animation: sway 6s ease-in-out infinite alternate; transform-origin: 140px 390px; }
  @keyframes sway { to { transform: skewX(-8deg) translateX(-10px); } }
  .shadow-third { opacity: 0; animation: arrive 3s ease 4.2s forwards; }
  @keyframes arrive { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  .drop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: splat 0.35s ease-out forwards; }
  @keyframes splat { 0% { opacity: 0; transform: scale(2.4); } 100% { opacity: 0.9; transform: scale(1); } }
  .topper { animation: fade 1.8s ease 1s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .kicker, .author, .title-wrap, .shadow-third, .drop, .topper { opacity: 1; }
    .drop { opacity: 0.9; }
  }
</style>
</head>
<body>
<main class="cover">
  <header>
    <p class="kicker">A psychological thriller</p>
    <p class="author" aria-label="D.H.">D.H.</p>
  </header>

  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 300 400" role="img">
      <defs>
        <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
        <linearGradient id="gown" x1="0" x2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#cfc6d4"/>
        </linearGradient>
        <linearGradient id="suit" x1="0" x2="1">
          <stop offset="0" stop-color="#2a2a30"/>
          <stop offset="1" stop-color="#0b0b0e"/>
        </linearGradient>
      </defs>

      <!-- The shadow on the wall: it sways, and then someone else is in it -->
      <g filter="url(#blur)" fill="#120615" opacity="0.7">
        <g class="shadow-couple" transform="translate(-58 6)">
          <circle cx="122" cy="100" r="20"/>
          <path d="M104 122 Q122 116 140 122 L138 200 Q160 300 168 384 L76 384 Q90 300 106 200 Z"/>
          <circle cx="175" cy="88" r="22"/>
          <path d="M150 116 Q175 106 200 116 L208 300 L198 384 L152 384 L144 300 Z"/>
        </g>
        <g class="shadow-third">
          <circle cx="22" cy="104" r="19"/>
          <path d="M6 124 Q22 118 38 124 L42 220 Q50 300 54 384 L-6 384 Q-2 300 2 220 Z"/>
        </g>
      </g>

      <!-- The cake topper -->
      <g class="topper">
        <!-- groom -->
        <path d="M150 116 Q175 106 200 116 L208 300 L198 384 L180 384 L176 300 L172 384 L154 384 L144 300 Z" fill="url(#suit)"/>
        <path d="M167 116 L175 150 L183 116 Z" fill="#f4f1f4"/>
        <path d="M173 122 L177 122 L178 146 L175 152 L172 146 Z" fill="#0e0e12"/>
        <circle cx="175" cy="88" r="22" fill="#e6c7b4"/>
        <path d="M153 84 Q156 60 178 62 Q198 64 197 84 Q190 72 176 72 Q162 72 153 84 Z" fill="#2b1a14"/>
        <!-- bride -->
        <path d="M104 122 Q122 116 140 122 L138 200 Q160 300 168 384 L76 384 Q90 300 106 200 Z" fill="url(#gown)"/>
        <path d="M138 130 Q160 118 170 112" stroke="#e6c7b4" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="122" cy="100" r="20" fill="#ecd0bf"/>
        <circle cx="106" cy="90" r="11" fill="#7a3f22"/>
        <path d="M102 98 Q104 76 124 78 Q142 80 142 98 Q134 86 122 86 Q110 88 102 98 Z" fill="#7a3f22"/>
        <path d="M104 86 Q122 78 140 88" stroke="#e9e3c9" stroke-width="2" fill="none"/>
        <g>
          <circle cx="124" cy="214" r="9" fill="#f3c6d3"/>
          <circle cx="134" cy="210" r="8" fill="#ffffff"/>
          <circle cx="130" cy="221" r="8" fill="#e8a7bb"/>
          <circle cx="118" cy="222" r="7" fill="#ffffff"/>
          <path d="M126 228 L124 248 M130 228 L132 246" stroke="#5f7d4c" stroke-width="2"/>
        </g>
      </g>

      <!-- Blood, drop by drop -->
      <g fill="#b5121f">
        <circle class="drop" cx="232" cy="150" r="3.5" style="animation-delay:1.8s"/>
        <circle class="drop" cx="246" cy="176" r="2.2" style="animation-delay:1.95s"/>
        <circle class="drop" cx="222" cy="198" r="4.2" style="animation-delay:2.1s"/>
        <circle class="drop" cx="258" cy="210" r="2.8" style="animation-delay:2.2s"/>
        <circle class="drop" cx="240" cy="232" r="1.8" style="animation-delay:2.3s"/>
        <circle class="drop" cx="268" cy="188" r="1.6" style="animation-delay:2.35s"/>
        <circle class="drop" cx="214" cy="244" r="3" style="animation-delay:2.45s"/>
        <circle class="drop" cx="276" cy="240" r="2.4" style="animation-delay:2.55s"/>
        <circle class="drop" cx="250" cy="262" r="3.6" style="animation-delay:2.6s"/>
        <circle class="drop" cx="226" cy="276" r="1.7" style="animation-delay:2.7s"/>
        <circle class="drop" cx="262" cy="290" r="2" style="animation-delay:2.75s"/>
        <circle class="drop" cx="208" cy="168" r="1.5" style="animation-delay:2.8s"/>
        <circle class="drop" cx="150" cy="70" r="2.6" style="animation-delay:2.9s"/>
        <circle class="drop" cx="128" cy="160" r="1.8" style="animation-delay:3s"/>
        <circle class="drop" cx="284" cy="160" r="1.4" style="animation-delay:3.05s"/>
        <circle class="drop" cx="236" cy="120" r="1.9" style="animation-delay:3.1s"/>
      </g>
    </svg>
  </div>

  <footer>
    <div class="title-wrap">
      <h1 class="title" data-text="SECOND HOME">SECOND HOME</h1>
      <p class="byline">Written by Dina Helmy</p>
    </div>
    <a class="begin" href="chapter-1.html">Begin reading</a>
  </footer>
</main>
</body>
</html>
