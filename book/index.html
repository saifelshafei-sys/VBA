<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Home — D.H.</title>
<meta name="description" content="Second Home, a psychological thriller by D.H. (Dina Helmy).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Oswald:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 2.5rem 16px 3rem;
    background:
      radial-gradient(ellipse at 50% 45%, #a43aa9 0%, var(--violet) 25%, var(--plum) 62%, var(--night) 100%);
    overflow: hidden;
    position: relative;
  }
  .kicker {
    font-family: var(--display);
    font-size: clamp(0.75rem, 2.6vw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 0;
    color: var(--paper);
    opacity: 0;
    animation: fade 1.4s ease 0.2s forwards;
  }
  .author {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(4rem, 22vw, 8rem);
    line-height: 1;
    letter-spacing: 0.12em;
    margin: 0.5rem 0 0;
    padding-left: 0.12em;
    color: var(--paper);
    opacity: 0;
    animation: fade 1.6s ease 0.5s forwards;
  }
  .title {
    position: relative;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(3.4rem, 17vw, 6.8rem);
    line-height: 0.95;
    margin: 0;
    color: transparent;
    letter-spacing: 0.03em;
  }
  .title::before, .title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: var(--blood);
  }
  /* The title cracks along a diagonal line */
  .title::before {
    clip-path: polygon(0 0, 100% 0, 100% 38%, 0 62%);
    animation: crack-top 0.5s cubic-bezier(.3,1.6,.5,1) 3.2s forwards;
  }
  .title::after {
    clip-path: polygon(0 64%, 100% 40%, 100% 100%, 0 100%);
    animation: crack-bottom 0.5s cubic-bezier(.3,1.6,.5,1) 3.2s forwards;
  }
  @keyframes crack-top    { to { transform: translate(-4px, -3px) rotate(-0.6deg); } }
  @keyframes crack-bottom { to { transform: translate(5px, 3px) rotate(0.5deg); } }
  .title-wrap { opacity: 0; animation: fade 1s ease 2.4s forwards; }
  .byline {
    margin: 1.2rem 0 0;
    font-style: italic;
    color: var(--paper);
  }
  .begin {
    display: inline-block;
    margin-top: 1.8rem;
    padding: 0.85rem 2.2rem;
    border: 1px solid var(--paper);
    border-radius: 999px;
    font-family: var(--display);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    font-size: 0.9rem;
    transition: background 0.3s, color 0.3s;
  }
  .cover-photo {
    position: absolute;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: reveal-photo 3.5s ease 0.3s forwards, drift 24s ease-in-out 0.3s infinite alternate;
  }
  @keyframes reveal-photo { from { opacity: 0; filter: brightness(0.2); } to { opacity: 1; filter: none; } }
  @keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.1) translateY(-1.5%); } }
  .cover { isolation: isolate; }
  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(to bottom, rgba(26,10,29,0.75) 0%, transparent 30%, transparent 55%, rgba(26,10,29,0.92) 100%);
  }

  /* Cold open: one line on black before the cover */
  .coldopen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 16px;
    background: #000;
    text-align: center;
  }
  .coldopen .line {
    max-width: 30rem;
    font-size: clamp(1.35rem, 5.4vw, 2rem);
    line-height: 1.5;
    font-style: italic;
    margin: 0;
  }
  .coldopen .line .red { color: var(--blood); font-style: normal; font-family: var(--display); letter-spacing: 0.03em; }
  .coldopen .down {
    display: block;
    margin-top: 3rem;
    color: var(--muted);
    font-family: var(--display);
    letter-spacing: 0.3em;
    font-size: 0.8rem;
    text-transform: uppercase;
    text-decoration: none;
    animation: bob 2.4s ease-in-out infinite;
  }
  html.js .coldopen .down { opacity: 0; transition: opacity 1s; }
  html.js .coldopen.done .down { opacity: 1; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--paper); vertical-align: -0.15em; margin-left: 2px; animation: blinkc 0.9s steps(1) infinite; }
  @keyframes blinkc { 50% { opacity: 0; } }

  .begin:hover, .begin:focus-visible { background: var(--paper); color: var(--night); }

  /* Without JS show the cover as a still; with JS hold the intro until the cover scrolls into view */
  html:not(.js) .kicker, html:not(.js) .author, html:not(.js) .title-wrap, html:not(.js) .cover-photo { opacity: 1; animation: none; }
  html.js .cover:not(.play) *, html.js .cover:not(.play) *::before, html.js .cover:not(.play) *::after { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    .kicker, .author, .title-wrap, .cover-photo { opacity: 1; }
    .coldopen .line { visibility: visible; }
  }
</style>
</head>
<body>
<section class="coldopen">
  <div>
    <p class="line" id="hook">By the time you finish reading this, my husband will be dead. <span class="red">And everyone will believe I'm the one who loved him.</span></p>
    <a class="down" href="#cover">Scroll</a>
  </div>
</section>

<main class="cover" id="cover">
  <header>
    <p class="kicker">A psychological thriller</p>
    <p class="author" aria-label="D.H.">D.H.</p>
  </header>

  <img class="cover-photo" src="img/cover.jpg" alt="" onerror="this.onerror=null;this.src='https://d8j0ntlcm91z4.cloudfront.net/user_2zOvHxALbu7dcd2kTtVRb8rfFKa/hf_20261029_182643_2029db50-754e-4665-9feb-a133cec99464.png'">

  <footer>
    <div class="title-wrap">
      <h1 class="title" data-text="SECOND HOME">SECOND HOME</h1>
      <p class="byline">Written by Dina Helmy</p>
    </div>
    <a class="begin" href="chapter-1.html">Begin reading</a>
  </footer>
</main>
<script src="motion.js"></script>
<script>
  // Start the cover's intro once it is on screen.
  (function () {
    var cover = document.getElementById('cover');
    if (!('IntersectionObserver' in window)) { cover.classList.add('play'); return; }
    new IntersectionObserver(function (es, o) {
      if (es[0].isIntersecting) { cover.classList.add('play'); o.disconnect(); }
    }, { threshold: 0.35 }).observe(cover);
  })();

  // Type the cold-open line, then reveal the scroll cue.
  (function () {
    var box = document.querySelector('.coldopen');
    var line = document.getElementById('hook');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { box.classList.add('done'); return; }
    var parts = Array.prototype.map.call(line.childNodes, function (n) { return { node: n, text: n.textContent }; });
    parts.forEach(function (p) { p.node.textContent = ''; });
    var caret = document.createElement('span');
    caret.className = 'caret';
    line.appendChild(caret);
    var i = 0, j = 0;
    setTimeout(function step() {
      if (i >= parts.length) { box.classList.add('done'); return; }
      var p = parts[i];
      p.node.textContent = p.text.slice(0, ++j);
      if (j >= p.text.length) { i++; j = 0; return setTimeout(step, 700); }
      setTimeout(step, p.text[j - 1] === '.' || p.text[j - 1] === ',' ? 450 : 45);
    }, 900);
  })();
</script>
</body>
</html>
